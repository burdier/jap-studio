name: Build Windows (Jap Studio)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
    paths-ignore:
      - "landing/**"
      - "docs/**"
      - "assets/video-sfx/**"
      - "scripts/render_video.py"
      - "scripts/gen_video_foley.py"
      - "README.md"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  build-windows:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ always() }}

      - name: Build release binary (ui + p2p)
        run: cargo build --release --features ui,p2p

      - name: Package portable Windows bundle
        shell: pwsh
        run: |
          $stage = "dist\JapStudio-Windows-x64"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\daw-gpui.exe" "$stage\jap-studio.exe"
          if (Test-Path "assets") {
            Copy-Item -Recurse "assets" "$stage\assets"
            Remove-Item -Recurse -Force "$stage\assets\soundfonts\freepats" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$stage\assets\video-sfx" -ErrorAction SilentlyContinue
          }
          if (Test-Path "README.md") {
            Copy-Item "README.md" "$stage\README.md"
          }
          Compress-Archive -Path "$stage" -DestinationPath "JapStudio-Windows-x64.zip" -Force
          Get-Item "JapStudio-Windows-x64.zip" | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: JapStudio-Windows-x64
          path: JapStudio-Windows-x64.zip
          retention-days: 30

      - name: Attach Windows bundle to v0.8.0 release (if present)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          gh release view v0.8.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.8.0 JapStudio-Windows-x64.zip --clobber
          } else {
            Write-Host "Release v0.8.0 no existe aún; se conserva como artifact."
          }
